<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Avanza</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Avanza">
<style>
  :root{
    --ink:#17181A; --ink2:#3A3D42; --amber:#E8A13A; --amber-d:#B87813;
    --green:#34C759; --red:#FF3B30; --gray:#8C9096; --blue:#007AFF;
    --bg:#F2F2F7; --surface:#fff; --sep:rgba(60,60,67,0.1);
    --muted:rgba(60,60,67,0.6); --muted2:rgba(60,60,67,0.5);
    --safe-t:env(safe-area-inset-top); --safe-b:env(safe-area-inset-bottom);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,system-ui,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;overflow:hidden}
  input,button,textarea{font-family:inherit}
  button{cursor:pointer}
  #app{position:fixed;inset:0;overflow:hidden}
  .scroll{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch}

  /* ---------- genéricos ---------- */
  .card{background:var(--surface);border-radius:20px;box-shadow:0 1px 2px rgba(0,0,0,.04);overflow:hidden}
  .row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--sep)}
  .row:first-child{border-top:0}
  .btn{border:none;border-radius:16px;padding:15px;font-size:16px;font-weight:600;letter-spacing:-.2px;width:100%}
  .btn-dark{background:var(--ink);color:#fff;box-shadow:0 6px 18px rgba(23,24,26,.28)}
  .btn-dark:active{background:var(--ink2)}
  .btn-ghost{background:transparent;border:1px solid rgba(23,24,26,.16);color:var(--ink)}
  .btn-soft{background:rgba(120,120,128,.12);color:var(--amber)}
  .btn-amber{background:var(--amber);color:#fff}
  .btn:disabled{opacity:.5}
  .avatar{border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
    color:#fff;font-weight:600;background:linear-gradient(180deg,#8C9096,#17181A)}
  .h1{font-size:34px;font-weight:700;letter-spacing:-.9px}
  .muted{color:var(--muted)}
  .sec-title{font-size:20px;font-weight:700;letter-spacing:-.45px;padding:26px 20px 8px}
  .over-label{font-size:13px;font-weight:600;letter-spacing:.2px;text-transform:uppercase;color:var(--muted)}
  .icon-badge{width:34px;height:34px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center}
  .pill{font-size:11px;font-weight:600;padding:4px 8px;border-radius:8px}
  .state-out{color:var(--amber-d)} .state-ok{color:var(--green)}

  /* ---------- login ---------- */
  #login{position:absolute;inset:0;background:#000;overflow:hidden}
  .lg-hero{position:absolute;top:0;left:0;right:0;height:60%;background:#DCDCE1;overflow:hidden}
  .lg-hero img{width:100%;height:100%;object-fit:cover;object-position:50% 45%}
  .lg-hero .grad{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.42),rgba(0,0,0,.1) 26%,rgba(0,0,0,0) 46%,rgba(0,0,0,.5) 82%,rgba(0,0,0,.72))}
  .lg-logo{position:absolute;left:26px;top:calc(var(--safe-t) + 54px)}
  .lg-slogan{position:absolute;left:26px;right:26px;bottom:70px;color:#fff}
  .lg-slogan .a{font-size:34px;font-weight:700;line-height:1.08;letter-spacing:-1.1px}
  .lg-slogan .b{font-size:34px;font-weight:300;line-height:1.08;letter-spacing:-1.1px;color:rgba(255,255,255,.92)}
  .lg-slogan .bar{width:44px;height:3px;border-radius:2px;background:#fff;opacity:.9;margin-top:16px}
  .lg-panel{position:absolute;left:0;right:0;bottom:0;min-height:44%;background:rgba(242,242,247,.96);
    backdrop-filter:saturate(180%) blur(26px);-webkit-backdrop-filter:saturate(180%) blur(26px);
    border-radius:30px 30px 0 0;box-shadow:0 -14px 40px rgba(0,0,0,.35);
    padding:22px 24px calc(var(--safe-b) + 30px)}
  .lg-panel .lead{font-size:15px;line-height:1.35;color:var(--muted);padding:2px 2px 16px}
  .gbtn{display:flex;align-items:center;justify-content:center;gap:10px}
  .gbtn .g{width:24px;height:24px;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#1C1C1E}
  .legal{text-align:center;font-size:12.5px;line-height:1.4;color:var(--muted2);padding-top:16px}

  /* ---------- app shell ---------- */
  .topfade{padding-top:calc(var(--safe-t) + 8px)}
  .home-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:8px 20px 0}
  .brandmini{display:flex;align-items:center;gap:7px;margin-bottom:6px}
  .kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:20px 20px 0}
  .kpi{background:#fff;border-radius:18px;padding:13px 12px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .kpi b{font-size:24px;font-weight:600;letter-spacing:-.6px;display:block}
  .kpi span{font-size:11.5px;line-height:1.25;color:var(--muted);margin-top:3px;display:block}
  .progress{margin:18px 20px 0;position:relative;overflow:hidden;border-radius:22px;
    background:linear-gradient(135deg,#17181A,#3A3D42);box-shadow:0 8px 22px rgba(23,24,26,.26);padding:18px}
  .progress .k{font-size:12px;font-weight:600;letter-spacing:1.6px;text-transform:uppercase;color:rgba(255,255,255,.7)}
  .progress h3{font-size:22px;font-weight:700;letter-spacing:-.5px;color:#fff;margin:6px 0 0;max-width:220px}
  .progress .track{height:6px;border-radius:3px;background:rgba(255,255,255,.25);margin-top:14px;overflow:hidden}
  .progress .fill{height:100%;border-radius:3px;background:var(--amber)}
  .progress .sub{font-size:12.5px;color:rgba(255,255,255,.8);margin-top:8px}

  .tasklist .ck{width:24px;height:24px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff}
  .tasklist .tt{font-size:16px;letter-spacing:-.25px}
  .tasklist .ts{font-size:13px;color:var(--muted);margin-top:1px}

  .seg{display:flex;background:rgba(120,120,128,.12);border-radius:10px;padding:2px}
  .seg button{flex:1;border:none;background:transparent;font-size:13px;font-weight:600;padding:7px 4px;border-radius:8px;color:var(--ink)}
  .seg button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .search{display:flex;align-items:center;gap:8px;background:rgba(120,120,128,.12);border-radius:12px;padding:9px 12px}
  .search input{flex:1;min-width:0;border:none;outline:none;background:none;font-size:16px;letter-spacing:-.25px;color:var(--ink)}

  /* ---------- tab bar ---------- */
  .tabbar{position:absolute;left:0;right:0;bottom:0;z-index:40;padding:8px 10px calc(var(--safe-b) + 18px);
    background:rgba(249,249,249,.9);backdrop-filter:saturate(180%) blur(22px);-webkit-backdrop-filter:saturate(180%) blur(22px);
    border-top:1px solid var(--sep);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:center}
  .tabbar button{border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 0;color:var(--muted2)}
  .tabbar button.on{color:var(--ink)}
  .tabbar .lab{font-size:10.5px;font-weight:500;letter-spacing:-.05px}
  .tabbar .scanbtn{width:52px;height:52px;margin:-22px auto 0;border-radius:26px;background:var(--ink);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(23,24,26,.35),0 0 0 4px rgba(249,249,249,.9)}

  /* ---------- modales / overlays ---------- */
  .overlay{position:absolute;inset:0;z-index:70;display:flex;flex-direction:column}
  .sheet{margin-top:auto;background:rgba(242,242,247,.98);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);
    border-radius:28px 28px 0 0;padding:10px 20px calc(var(--safe-b) + 24px)}
  .grabber{width:38px;height:5px;border-radius:3px;background:rgba(60,60,67,.3);margin:0 auto 14px}
  @keyframes scanline{0%{transform:translateY(0)}100%{transform:translateY(188px)}}
  .toast{position:absolute;left:20px;right:20px;bottom:calc(var(--safe-b) + 96px);z-index:90;background:rgba(28,28,30,.94);
    color:#fff;border-radius:16px;padding:12px 16px;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.3);
    opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none}
  .toast.show{opacity:1;transform:none}
  .loading{position:absolute;inset:0;z-index:95;background:rgba(255,255,255,.4);display:none;align-items:center;justify-content:center}
  .loading.on{display:flex}
  .spin{width:34px;height:34px;border:3px solid rgba(0,0,0,.15);border-top-color:var(--ink);border-radius:50%;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .center-screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 30px;gap:14px}
  video{width:100%;height:100%;object-fit:cover}
</style>
</head>

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function nombreDe(email){ email=String(email||''); var p=email.split('@')[0].replace(/[._-]+/g,' ').trim();
  return p ? p.replace(/\b\w/g,function(c){return c.toUpperCase();}) : email; }
function iniciales(email){ var n=nombreDe(email).split(' '); 
  return ((n[0]||' ')[0]+((n[1]||'')[0]||'')).toUpperCase() || (email||'?')[0].toUpperCase(); }

/* ======================= ESTADO ======================= */
var sb = null;
var S = { me:null, empresa:null, viewEmpresaId:null, tab:'home',
  recursos:[], tareas:[], equipo:[], solicitudes:[], historial:[], empresas:[],
  seg:'Todos', query:'', settings:false, scan:false, scanRecurso:null };

function empresaActivaId(){ return S.viewEmpresaId || (S.me && S.me.empresa_id) || null; }
function esSuper(){ return S.me && S.me.rol_plataforma === 'superadmin'; }
function esAdmin(){ return esSuper() || (S.me && S.me.rol === 'admin'); }

/* ======================= ARRANQUE ======================= */
function configOk(){ return /^https:\/\//.test(SUPABASE_URL) && SUPABASE_ANON_KEY.length > 20 && SUPABASE_URL.indexOf('PON_AQUI')===-1; }

window.addEventListener('DOMContentLoaded', function(){
  if(!configOk()){ pantallaConfig(); return; }
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  sb.auth.onAuthStateChange(function(_e, sess){ boot(sess); });
  sb.auth.getSession().then(function(r){ boot(r.data.session); });
});

var _booting=false;
async function boot(session){
  if(_booting) return; _booting=true;
  try{
    if(!session){ S.me=null; render(); return; }
    S.me = await cargarPerfil(session.user);
    if(!S.me){ render(); return; }
    if(esSuper() && !S.viewEmpresaId){ await cargarEmpresas(); render(); return; }
    var eid = empresaActivaId();
    if(!eid){ render(); return; }              /* usuario sin empresa -> unirse */
    await cargarEmpresa(eid);
    if(!esSuper() && S.empresa && S.empresa.estado_suscripcion === 'standby'){ render(); return; }
    await cargarDatosEmpresa(eid);
    render();
  }catch(err){ console.error(err); flash('Error: '+(err.message||err)); render(); }
  finally{ _booting=false; }
}

async function cargarPerfil(user){
  for(var i=0;i<3;i++){
    var r = await sb.from('perfiles').select('*').eq('id', user.id).maybeSingle();
    if(r.data) return r.data;
    await new Promise(function(res){ setTimeout(res, 700); });   /* el trigger puede tardar un instante */
  }
  /* red de seguridad: si el trigger no creó el perfil, lo creamos */
  var rol_plataforma = user.email === SUPERADMIN_EMAIL ? 'superadmin' : 'usuario';
  var ins = await sb.from('perfiles').insert({ id:user.id, email:user.email, rol_plataforma:rol_plataforma }).select().maybeSingle();
  return ins.data || { id:user.id, email:user.email, rol_plataforma:rol_plataforma, empresa_id:null, rol:'trabajador' };
}
async function cargarEmpresa(eid){ var r = await sb.from('empresas').select('*').eq('id', eid).maybeSingle(); S.empresa = r.data; }
async function cargarEmpresas(){ var r = await sb.from('empresas').select('*').order('nombre'); S.empresas = r.data||[]; }
async function cargarDatosEmpresa(eid){
  var a = await sb.from('recursos').select('*, poseedor:perfiles!poseedor_id(email)').eq('empresa_id', eid).order('nombre');
  S.recursos = a.data || [];
  var t = await sb.from('tareas').select('*, asignado:perfiles!asignado_a(email)').eq('empresa_id', eid).order('fecha_limite',{nullsFirst:false});
  S.tareas = t.data || [];
  var e = await sb.from('perfiles').select('*').eq('empresa_id', eid);
  S.equipo = e.data || [];
  var h = await sb.from('historial_recursos').select('*, recurso:recursos(nombre,tipo), trabajador:perfiles!trabajador_id(email)').order('fecha',{ascending:false}).limit(8);
  S.historial = (h.data||[]).filter(function(x){ return x.recurso; });
  if(esAdmin()){
    var so = await sb.from('solicitudes_acceso').select('*').eq('empresa_id', eid).eq('estado','pendiente').order('creado_en');
    var sol = so.data || [];
    if(sol.length){ var ids = sol.map(function(x){return x.usuario_id;});
      var pe = await sb.from('perfiles').select('id,email').in('id', ids);
      var mapa = {}; (pe.data||[]).forEach(function(p){ mapa[p.id]=p.email; });
      sol.forEach(function(x){ x._email = mapa[x.usuario_id]||''; });
    }
    S.solicitudes = sol;
  } else S.solicitudes = [];
}

/* ======================= ACCIONES ======================= */
async function entrarGoogle(){
  cargando(true);
  var url = window.location.href.split('#')[0];
  var r = await sb.auth.signInWithOAuth({ provider:'google', options:{ redirectTo:url } });
  if(r.error){ cargando(false); flash(r.error.message); }
}
async function salir(){ if(!confirm('¿Cerrar sesión?')) return; await sb.auth.signOut();
  S.viewEmpresaId=null; S.settings=false; location.reload(); }

async function solicitarUnirse(eid, nombre){
  cargando(true);
  var ya = await sb.from('solicitudes_acceso').select('id').eq('usuario_id',S.me.id).eq('empresa_id',eid).eq('estado','pendiente').maybeSingle();
  if(ya.data){ cargando(false); flash('Ya tienes una solicitud pendiente en '+nombre); return; }
  var r = await sb.from('solicitudes_acceso').insert({ usuario_id:S.me.id, empresa_id:eid });
  cargando(false);
  if(r.error){ flash(r.error.message); return; }
  flash('Solicitud enviada a '+nombre+'. Te avisarán al aprobarla.');
}

async function coger(r){
  cargando(true);
  var up = await sb.from('recursos').update({ poseedor_id:S.me.id, estado:'prestado', fecha_prestamo:new Date().toISOString() }).eq('id',r.id).is('poseedor_id',null).select().maybeSingle();
  if(up.data){ await sb.from('historial_recursos').insert({ recurso_id:r.id, trabajador_id:S.me.id, accion:'coger' }); flash(r.nombre+' — cogido'); }
  else flash('Ese recurso ya no está disponible.');
  await recargar();
}
async function devolver(r){
  cargando(true);
  var up = await sb.from('recursos').update({ poseedor_id:null, estado:'disponible', fecha_prestamo:null }).eq('id',r.id).eq('poseedor_id',S.me.id).select().maybeSingle();

      (esSuper()?'<div style="padding:26px 20px 0"><button class="btn btn-ghost" onclick="volverPanel()">← Volver al panel de empresas</button></div>':'')+
      '<div class="card" style="margin:26px 20px 0"><button onclick="salir()" style="width:100%;border:none;background:none;padding:15px;display:flex;flex-direction:column;align-items:center;gap:2px">'+
        '<span style="font-size:17px;font-weight:600;color:#FF3B30">Cerrar sesión</span><span class="muted" style="font-size:13px">'+esc(S.me.email)+'</span></button></div>'+
    '</div></div>';
}

/* ---- ESCÁNER ---- */
var _stream=null, _scanRAF=null;
function vScan(){
  return '<div class="overlay" style="background:rgba(0,0,0,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)">'+
    '<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:60px 24px 0">'+
      '<div style="position:relative;width:212px;height:212px;border-radius:26px;overflow:hidden;background:#000;border:1px solid rgba(255,255,255,.25)">'+
        '<video id="scanVideo" playsinline muted autoplay></video>'+
        '<div style="position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,rgba(140,144,150,0),#8C9096,rgba(140,144,150,0));animation:scanline 1.8s ease-in-out infinite alternate"></div></div>'+
      '<div style="font-size:15px;color:rgba(255,255,255,.85);text-align:center;max-width:250px" id="scanMsg">Apunta la cámara al código QR del recurso.</div></div>'+
    '<div class="sheet"><div class="grabber"></div>'+
      '<button class="btn btn-ghost" onclick="cerrarScan()" style="background:rgba(120,120,128,.12);color:var(--amber);border:none">Cancelar</button>'+
      '<button class="btn" style="margin-top:8px;background:rgba(120,120,128,.12);color:var(--ink)" onclick="pedirCodigoManual()">Escribir código a mano</button></div></div>';
}
function abrirScan(){ S.scan=true; render(); iniciarCamara(); }
function cerrarScan(){ pararCamara(); S.scan=false; render(); }
async function iniciarCamara(){
  var v=$('scanVideo'); if(!v) return;
  try{ _stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}); v.srcObject=_stream;
    var cv=document.createElement('canvas'), cx=cv.getContext('2d');
    (function tick(){ if(!S.scan) return;
      if(v.readyState===v.HAVE_ENOUGH_DATA){ cv.width=v.videoWidth; cv.height=v.videoHeight; cx.drawImage(v,0,0);
        try{ var img=cx.getImageData(0,0,cv.width,cv.height); var code=jsQR(img.data,cv.width,cv.height);
          if(code && code.data){ manejarQR(code.data.trim()); return; } }catch(e){} }
      _scanRAF=requestAnimationFrame(tick); })();
  }catch(e){ var m=$('scanMsg'); if(m) m.textContent='No se pudo abrir la cámara. Usa "Escribir código a mano".'; }
}
function pararCamara(){ if(_scanRAF) cancelAnimationFrame(_scanRAF); if(_stream){ _stream.getTracks().forEach(function(t){t.stop();}); _stream=null; } }
function pedirCodigoManual(){ var c=prompt('Código o id del recurso:'); if(c) manejarQR(c.trim()); }
function manejarQR(txt){
  var idm = txt.match(/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/i);
  var id = idm?idm[0]:txt;
  var r = S.recursos.find(function(x){ return x.id===id || x.nombre.toLowerCase()===txt.toLowerCase(); });
  pararCamara();
  if(!r){ flash('Recurso no encontrado: '+txt); S.scan=false; render(); return; }
  S.scan=false; render();
  if(!r.poseedor_id){ if(confirm('Coger «'+r.nombre+'»?')) coger(r); }
  else if(r.poseedor_id===S.me.id){ if(confirm('Devolver «'+r.nombre+'»?')) devolver(r); }
  else flash('«'+r.nombre+'» lo tiene '+(r.poseedor?nombreDe(r.poseedor.email):'otra persona'));
}
